<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>기아셀토스:이벤트페이지</title>
        <link href="css/reset.css" rel="stylesheet" type="text/css"/>
        <link href="css/portfolio_event.css" rel="stylesheet" type="text/css"/>
        <link href="js/top.js" rel="stylesheet" type="text/js"/>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        
        <!-- aos -->
        <script type="text/javascript" src="./js/scroll.js"></script>

        <!-- aos -->
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
 
        <!-- favicon -->
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="icon" type="image/png" sizes="16x16" href="./images/portfolio_event/favicon.ico">

        <!-- Top Button -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>

        <!-- Icon Effect: Slide Down -->
        <script src="http://code.jquery.com/jquery-1.10.1.min.js"></script>

    </head> 
    <body>
        <script> 
            AOS.init(); 
         </script>

        <div id="wrap">    
            <div id="margin">
                <section class="con01">
                  <div class="main_img01"></div>
                  <div class="main_img02"></div>
                  <div class="main_text"></div>        
                  <div class="main_cloud">
                
                  </div>      
                  <div class="windmill">
                    <div class="windmillcenter"></div>
                    <div class="windmill01"></div>
                    <div class="windmill02"></div>
                  </div>      
                </section>
                 

                <section class="con02">
                    <div class="overview">
                        <div class="overview01"><img src="./images/portfolio_event/overview01.png"></div>
                        <div class="overview02"><img src="./images/portfolio_event/overview02.png"></div>
                        <div class="overview03"><img src="./images/portfolio_event/overview03.png" data-aos="fade-up" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                    </div>
                    <div class="typo">
                        <div class="typo01"><img src="./images/portfolio_event/typo01.png"></div>
                        <div class="typo02"><img src="./images/portfolio_event/typo02.png"></div>
                        <div class="typo03"><img src="./images/portfolio_event/typo03.png" data-aos="fade-right" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                    </div>
                    <div class="color">
                        <div class="color01"><img src="./images/portfolio_event/color01.png"></div>
                        <div class="color02"><img src="./images/portfolio_event/color02.png"></div>
                        <div class="color03"><img src="./images/portfolio_event/color03.png" data-aos="fade-up" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                    </div>
                 
                    <div class="work">
                        <div class="work01"><img src="./images/portfolio_event/work01.png"></div>
                        <div class="work02"><img src="./images/portfolio_event/work02.png"></div>
                        <div class="work03">
                            <img src="./images/portfolio_event/work03.png" data-aos="fade-right" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200">
                            <img src="./images/portfolio_event/work04.png" data-aos="fade-right" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="400">
                            <img src="./images/portfolio_event/work05.png" data-aos="fade-right" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="600">
                        </div>
                        <div class="workbg"></div>
                    </div>       
                </section>
               
                <div class="con02_1"></div>

                <section class="con03">
                    <div class="event"><img src="./images/portfolio_event/event.png"></div>
                    <div class="eventpage">
                        <div class="eventmain">
                            <div class="main_img01"></div>
                            <div class="main_img02"></div>
                            <div class="main_text"></div>        
                            <div class="main_cloud">
                              
                            </div>      
                            <div class="windmill">
                              <div class="windmillcenter"></div>
                              <div class="windmill01"></div>
                              <div class="windmill02"></div>
                            </div>    
                        </div>
                        <div class="eventbg">
                            <div class="event01">
                                <div class="gifts"><img src="./images/portfolio_event/eventgifts.png" data-aos="zoom-in-down" data-aos-easing="linear" data-aos-duration="800" data-aos-delay="200"></div>
                                <div class="button01"><img src="./images/portfolio_event/button01.png"></div>
                            </div>
                            <div class="event02">
                                <div class="coment">
                                    <div class="coment01"><img src="./images/portfolio_event/coment01.png" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                                    <div class="coment02"><img src="./images/portfolio_event/coment02.png" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="400"></div>
                                </div>
                                <div class="icons">
                                   <div class="camera"><img src="./images/portfolio_event/camera.png" data-aos="fade-up" data-aos-anchor-placement="center-bottom" data-aos-duration="1000" data-aos-delay="200"></div>
                                   <div class="mobile"><img src="./images/portfolio_event/mobile.png" data-aos="fade-up" data-aos-anchor-placement="center-bottom" data-aos-duration="1000" data-aos-delay="200"></div>
                                   <div class="computer"><img src="./images/portfolio_event/computer.png" data-aos="fade-up" data-aos-anchor-placement="center-bottom" data-aos-duration="1000" data-aos-delay="200"></div>
                                </div>
                            </div>
                            <div class="event03">
                                <div class="projecter">
                                    <div class="projecter01"><img src="./images/portfolio_event/tent.png" data-aos="fade-up" data-aos-anchor-placement="center-bottom" data-aos-duration="1000" data-aos-delay="200"></div>
                                    <div class="projecter02"><img src="./images/portfolio_event/coupon.png" data-aos="fade-up" data-aos-anchor-placement="center-bottom" data-aos-duration="1000" data-aos-delay="200"></div>
                                </div>
                                <div class="button02"><img src="./images/portfolio_event/button02.png"></div>
                            </div>
                            <div class="event04">
                                <div class="lgiht">
                                    <img src="./images/portfolio_event/light.png" data-aos="flip-left" data-aos-anchor-placement="center-bottom" data-aos-duration="1000" data-aos-delay="400">                                 
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="banner">
                        <div class="bannertitle"><img src="./images/portfolio_event/banner.png"></div>
                        <div class="banner01"><img src="./images/portfolio_event/banner01.png"></div>
                    </div>
                    <div class="banner02"><img src="./images/portfolio_event/banner02.png" data-aos="fade-up" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                    <div class="banner03">
                        <div class="banner03_1"><img src="./images/portfolio_event/banner03.png" data-aos="fade-up" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                        <div class="banner03_2"><img src="./images/portfolio_event/banner04.png" data-aos="fade-up" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                    </div>
                </section>
                
                <section class="con04">
                    <div class="epil">
                        <div class="epil01"><img src="./images/portfolio_event/epil.png"></div>
                        <div class="epil01"><img src="./images/portfolio_event/epil01.png"></div>
                        <div class="epil01"><img src="./images/portfolio_event/epil02.png" data-aos="zoom-in-down" data-aos-easing="linear" data-aos-duration="800" data-aos-delay="200">></div>
                        <div class="epil01"><img src="./images/portfolio_event/epil03.png"></div>
                    </div>
                </section>
              
            </div>

            <div class="topBtn"><img src="./images/portfolio_event/top.png"></div>


             <!--탑버튼 !-->
             <script>
                $(function() {
                  $(window).scroll(function() { 
                    if ($(this).scrollTop() > 200) { 
                      $('.topBtn').fadeIn(); } 
                    else { $('.topBtn').fadeOut(); }
                  }); 
                  $(".topBtn").click(function() { 
                     $('html, body').animate({ scrollTop : 0  }, 300); 
                    return false; });
                });
            </script>

            <!--스크롤애니메이션 !-->
            <script>
                $(window).scroll(function() {
                    $('.con01_right').each(function(){
                    var imagePos = $(this).offset().top;

                    var topOfWindow = $(window).scrollTop();
                        if (imagePos < topOfWindow+900) {
                            $(this).addClass("rolling01");
                        }else{
                            $(this).removeClass("rolling01");
                        }
                    });
                });
            </script>
        </div>
    </body>
</html>
