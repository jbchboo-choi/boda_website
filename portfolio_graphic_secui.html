<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SECUI — Boda</title>
    <link href="css/reset.css" rel="stylesheet" type="text/css">
    <link href="css/menu_popup.css?v=20261014-menu14" rel="stylesheet" type="text/css">
    <link href="css/portfolio_pickgo.css?v=20261019-rounded1" rel="stylesheet" type="text/css">
    <link href="css/portfolio_moon320.css?v=20261019-package1" rel="stylesheet" type="text/css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        .pickgo-hero h1::before{content:none;}
        .secui-gallery-grid{grid-template-columns:1fr;}
        .secui-gallery-grid .moon320-gallery-item{
            display:block;
        }
        .secui-gallery-grid .moon320-gallery-item img{
            display:block;
            width:100%;
            height:auto;
            object-fit:contain;
        }
        .secui-gallery-grid .moon320-gallery-item:hover img,
        .secui-gallery-grid .moon320-gallery-item:focus-visible img{
            transform:none;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="margin">
            <header class="main">
                <div class="main01">
                    <div class="mainplus">
                        <a class="work-back-button" href="./portfolio.html?filter=graphic" aria-label="Graphic 작업 목록으로 이동">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                        </a>
                    </div>
                    <div class="mainmenu"><div>Work / Graphic</div></div>
                    <a href="./index.html" aria-label="Boda home"><div class="mainlogo"></div></a>
                </div>
            </header>

            <main class="pickgo-page moon320-page">
                <section class="pickgo-hero moon320-hero" aria-labelledby="secui-title">
                    <div class="pickgo-hero-copy">
                        <p class="pickgo-type-label">Graphic</p>
                        <h1 id="secui-title">SECUI</h1>
                        <p class="pickgo-summary">통합 보안 솔루션 기업 SECUI의 브랜드 메시지와 솔루션 정보를 효과적으로 전달하기 위해<br class="desktop-break"> 포스터와 그래픽 콘텐츠를 디자인한 프로젝트입니다.</p>
                        <div class="pickgo-rule"></div>
                        <dl class="pickgo-meta">
                            <div><dt>작업기간</dt><dd>2021년</dd></div>
                            <div><dt>프로젝트 구분</dt><dd>실무 프로젝트</dd></div>
                            <div><dt>참여 형태</dt><dd>단독 디자인 작업</dd></div>
                            <div><dt>담당 범위</dt><dd class="pickgo-tags"><span>일러스트 수정·재구성</span><span>이미지 합성</span><span>그래픽 편집</span><span>포스터 디자인</span></dd></div>
                            <div><dt>상태</dt><dd>작업 완료</dd></div>
                        </dl>
                        <div class="pickgo-actions">
                            <a class="pickgo-button pickgo-button-primary" href="#secui-gallery">디자인 상세 보기 <span class="pickgo-external-arrow" aria-hidden="true"></span></a>
                        </div>
                    </div>
                    <div class="pickgo-hero-media">
                        <img src="images/portfolio/secui/hero-original.png" alt="SECUI 홍보물과 솔루션 맵 목업">
                    </div>
                </section>

                <section class="moon320-gallery" id="secui-gallery" aria-labelledby="secui-gallery-title">
                    <div class="moon320-gallery-heading">
                        <div>
                            <p class="pickgo-eyebrow">DESIGN DETAILS</p>
                            <h2 id="secui-gallery-title">SECUI 그래픽 디자인</h2>
                        </div>
                    </div>
                    <div class="moon320-gallery-grid secui-gallery-grid">
                        <button class="moon320-gallery-item" type="button" aria-label="SECUI 솔루션 맵 크게 보기" data-image="images/portfolio/secui/solution-map.png" data-alt="SECUI Solution Map">
                            <img src="images/portfolio/secui/solution-map.png" alt="SECUI Solution Map" loading="lazy">
                        </button>
                        <button class="moon320-gallery-item moon320-gallery-item--poster" type="button" aria-label="SECUI 광고 목업 크게 보기" data-image="images/portfolio/secui/advertising.png" data-alt="SECUI 광고 목업">
                            <img src="images/portfolio/secui/advertising.png" alt="SECUI 광고 목업" loading="lazy">
                        </button>
                    </div>
                </section>
            </main>

            <div class="moon320-lightbox" role="dialog" aria-modal="true" aria-label="이미지 확대 보기" aria-hidden="true">
                <button class="moon320-lightbox-close" type="button" aria-label="확대 이미지 닫기">×</button>
                <img src="" alt="">
            </div>
        </div>
    </div>

    <script>
        (() => {
            const lightbox = document.querySelector('.moon320-lightbox');
            const lightboxImage = lightbox.querySelector('img');
            const closeButton = lightbox.querySelector('.moon320-lightbox-close');
            const galleryItems = document.querySelectorAll('.moon320-gallery-item');
            let lastFocusedItem = null;

            const closeLightbox = () => {
                lightbox.classList.remove('is-open');
                lightbox.setAttribute('aria-hidden', 'true');
                lightboxImage.removeAttribute('src');
                document.body.style.overflow = '';
                lastFocusedItem?.focus();
            };

            galleryItems.forEach((item) => {
                item.addEventListener('click', () => {
                    lastFocusedItem = item;
                    lightboxImage.src = item.dataset.image;
                    lightboxImage.alt = item.dataset.alt;
                    lightbox.classList.add('is-open');
                    lightbox.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                    closeButton.focus();
                });
            });

            closeButton.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (event) => {
                if (event.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
            });
        })();
    </script>
</body>
</html>
