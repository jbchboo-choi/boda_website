<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>채충자 국수 — Boda</title>
    <link href="css/reset.css" rel="stylesheet" type="text/css">
    <link href="css/menu_popup.css?v=20261014-menu14" rel="stylesheet" type="text/css">
    <link href="css/portfolio_pickgo.css?v=20261019-rounded1" rel="stylesheet" type="text/css">
    <link href="css/portfolio_moon320.css?v=20261019-package1" rel="stylesheet" type="text/css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        .pickgo-hero h1::before{content:none;}

        /* 채충자 갤러리 첫 카드만 행 높이를 채워 흰 여백 제거 */
        #chae-chungja-gallery .moon320-gallery-grid > .moon320-gallery-item:first-child {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #chae-chungja-gallery .moon320-gallery-grid > .moon320-gallery-item:first-child > img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 767px) {
            #chae-chungja-gallery .moon320-gallery-grid > .moon320-gallery-item:first-child {
                height: auto;
            }

            #chae-chungja-gallery .moon320-gallery-grid > .moon320-gallery-item:first-child > img {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="margin">
            <header class="main">
                <div class="main01">
                    <div class="mainplus">
                        <a class="work-back-button" href="./portfolio.html?filter=branding" aria-label="Branding 작업 목록으로 이동">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                        </a>
                    </div>
                    <div class="mainmenu"><div>Work / Branding</div></div>
                    <a href="./index.html" aria-label="Boda home"><div class="mainlogo"></div></a>
                </div>
            </header>

            <main class="pickgo-page moon320-page">
                <section class="pickgo-hero moon320-hero" aria-labelledby="chae-chungja-title">
                    <div class="pickgo-hero-copy">
                        <p class="pickgo-type-label">Branding</p>
                        <h1 id="chae-chungja-title">채충자 국수</h1>
                        <p class="pickgo-summary">평창의 자연을 모티브로, 기업 로고 디자인과 기존 국수 패키지의 개선 및 완성을 진행한<br class="desktop-break"> 브랜딩 프로젝트입니다.</p>
                        <div class="pickgo-rule"></div>
                        <dl class="pickgo-meta">
                            <div><dt>작업기간</dt><dd>2020</dd></div>
                            <div><dt>프로젝트 구분</dt><dd>실무 프로젝트</dd></div>
                            <div><dt>참여 형태</dt><dd>협업 프로젝트</dd></div>
                            <div><dt>담당 범위</dt><dd class="pickgo-tags"><span>기업 로고 디자인</span><span>패키지 디자인</span><span>라벨 디자인</span><span>그래픽 디자인</span></dd></div>
                            <div><dt>브랜드</dt><dd>(주)평창산들식품</dd></div>
                            <div><dt>상태</dt><dd>작업 완료</dd></div>
                        </dl>
                        <div class="pickgo-actions">
                            <a class="pickgo-button pickgo-button-primary" href="#chae-chungja-gallery">디자인 상세 보기 <span class="pickgo-external-arrow" aria-hidden="true"></span></a>
                        </div>
                    </div>
                    <div class="pickgo-hero-media">
                        <img src="images/portfolio/chae_chungja/hero.jpg" alt="채충자 국수 패키지 대표 이미지">
                    </div>
                </section>

                <section class="moon320-gallery" id="chae-chungja-gallery" aria-labelledby="chae-chungja-gallery-title">
                    <div class="moon320-gallery-heading">
                        <div>
                            <p class="pickgo-eyebrow">DESIGN DETAILS</p>
                            <h2 id="chae-chungja-gallery-title">채충자 국수 패키지 디자인</h2>
                        </div>
                    </div>
                    <div class="moon320-gallery-grid">
                        <button class="moon320-gallery-item" type="button" aria-label="채충자 국수 제품 이미지 크게 보기" data-image="images/portfolio/chae_chungja/detail-bottles.jpg" data-alt="채충자 국수 제품 이미지">
                            <img src="images/portfolio/chae_chungja/detail-bottles.jpg" alt="채충자 국수 제품 이미지" loading="lazy">
                        </button>
                        <button class="moon320-gallery-item" type="button" aria-label="채충자 국수 단일 제품 이미지 크게 보기" data-image="images/portfolio/chae_chungja/detail-single.jpg" data-alt="채충자 국수 단일 제품 이미지">
                            <img src="images/portfolio/chae_chungja/detail-single.jpg" alt="채충자 국수 단일 제품 이미지" loading="lazy">
                        </button>
                        <button class="moon320-gallery-item" type="button" aria-label="채충자 국수 패키지 시안 크게 보기" data-image="images/portfolio/chae_chungja/detail-package.jpg" data-alt="채충자 국수 패키지 시안">
                            <img src="images/portfolio/chae_chungja/detail-package.jpg" alt="채충자 국수 패키지 시안" loading="lazy">
                        </button>
                        <button class="moon320-gallery-item" type="button" aria-label="채충자 국수 4종 패키지 이미지 크게 보기" data-image="images/portfolio/chae_chungja/hero.jpg" data-alt="채충자 국수 4종 패키지 이미지">
                            <img src="images/portfolio/chae_chungja/hero.jpg" alt="채충자 국수 4종 패키지 이미지" loading="lazy">
                        </button>
                    </div>
                </section>
            </main>

            <div class="moon320-lightbox" role="dialog" aria-modal="true" aria-label="이미지 확대 보기" aria-hidden="true">
                <button class="moon320-lightbox-close" type="button" aria-label="확대 이미지 닫기">×</button>
                <img src="" alt="">
            </div>
        </div>
    </div>

    <script>
        (() => {
            const lightbox = document.querySelector('.moon320-lightbox');
            const lightboxImage = lightbox.querySelector('img');
            const closeButton = lightbox.querySelector('.moon320-lightbox-close');
            const galleryItems = document.querySelectorAll('.moon320-gallery-item');
            let lastFocusedItem = null;

            const closeLightbox = () => {
                lightbox.classList.remove('is-open');
                lightbox.setAttribute('aria-hidden', 'true');
                lightboxImage.removeAttribute('src');
                document.body.style.overflow = '';
                lastFocusedItem?.focus();
            };

            galleryItems.forEach((item) => {
                item.addEventListener('click', () => {
                    lastFocusedItem = item;
                    lightboxImage.src = item.dataset.image;
                    lightboxImage.alt = item.dataset.alt;
                    lightbox.classList.add('is-open');
                    lightbox.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                    closeButton.focus();
                });
            });

            closeButton.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (event) => {
                if (event.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
            });
        })();
    </script>
</body>
</html>
