                                <h2>Epilogue</h2>
                                <h3>사용자의 시선에서, 편리한 경험을 설계하다</h3>
                                <p>Easybab 모바일 앱을 직접 사용하는 입장에서 필요한 정보와 이용 흐름을 고민하며, 누구나 쉽고 직관적으로 요리 정보를 탐색할 수 있도록 설계했습니다. 와이어프레임을 통해 화면 구조와 콘텐츠의 우선순위를 정리하고, 모바일 환경에 적합한 레이아웃과 가독성을 고려했습니다. 또한 로고와 아이콘, 컬러와 타이포그래피를 콘셉트에 맞게 디자인하여 일관된 시각적 완성도를 확보했습니다. 사용자 관점의 문제 해결부터 화면 설계, 시각적 구현까지 연결하는 디자인에 집중했습니다.</p>

            <div class="topBtn"><span><img src="./images/portfolio_mobile/TOP.png"></span></div>


             <!--탑버튼 !-->
             <script>
                $(function() {
                  $(window).scroll(function() { 
                    if ($(this).scrollTop() > 200) { 
                      $('.topBtn').fadeIn(); } 
                    else { $('.topBtn').fadeOut(); }
                  }); 
                  $(".topBtn").click(function() { 
                     $('html, body').animate({ scrollTop : 0  }, 300); 
                    return false; });
                });
            </script>

            <!--스크롤애니메이션 !-->
            <script>
                $(window).scroll(function() {
                    $('.con01_right').each(function(){
                    var imagePos = $(this).offset().top;

                    var topOfWindow = $(window).scrollTop();
                        if (imagePos < topOfWindow+900) {
                            $(this).addClass("rolling01");
                        }else{
                            $(this).removeClass("rolling01");
                        }
                    });
                });
            </script>
