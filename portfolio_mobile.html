        <!-- favicon -->
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="icon" type="image/png" sizes="16x16" href="./images/portfolio_mobile/favicon.ico">

    </head> 
    <body>
        <script> 
            AOS.init(); 
         </script>

        <div id="wrap">

                        <div class="main_text"></div>

                            <div class="main_food02">
                                <img src="./images/portfolio_mobile/food02.png">

                            <div class="main_food03">
                                <img src="./images/portfolio_mobile/food03.png">
                            </div>
                        </div>
                       
                     </div>
                     <div class="con01_2">
                        <div class="con01_left">
                            <div class="egg"><img src="./images/portfolio_mobile/egg.png"></div>
                            <div class="kimchi"><img src="./images/portfolio_mobile/kimchi.png"></div>
                            <div class="meat"><img src="./images/portfolio_mobile/meat.png"></div>
                        </div>
                        <div class="con01_right">

                </section>
                 

                <section class="con02">

                        <img src="./images/portfolio_mobile/con02_title.png">
                    </div>
                    <div class="con02text"> 
                        <img src="./images/portfolio_mobile/con02_text01.png">
                        <img src="./images/portfolio_mobile/con02_text02.png" data-aos="fade-down" data-aos-duration="1000" data-aos-delay="200">
                    </div>

                </section>
                
                <section class="con03">

                   <div class="con03text" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"></div>
                </section>

                <section class="con04">
                    <div class="con04_1">
                        <div class="con04title"></div>
                        <div class="con04img">
                            <div class="simbol01"><img src="./images/portfolio_mobile/simbol01.png" data-aos="fade-left" data-aos-duration="1200" data-aos-delay="200"></div>
                            <div class="plus"><img src="./images/portfolio_mobile/plus.png"  data-aos="fade-left" data-aos-duration="1000" data-aos-delay="200"></div>

                            <div class="equal"><img src="./images/portfolio_mobile/equal.png"  data-aos="fade-right" data-aos-duration="1000" data-aos-delay="200"></div>
                            <div class="simbol02"><img src="./images/portfolio_mobile/simbol02.png"  data-aos="fade-right" data-aos-duration="1200" data-aos-delay="200"></div>
                        </div>
                    </div>
                    <div class="con04_2">
                        <div class="color">
                            <img src="./images/portfolio_mobile/colortitle.png" width="129px" height="39px">
                            <img src="./images/portfolio_mobile/maincolor.png" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200">
                        </div>
                        <div class="icon">
                         <img src="./images/portfolio_mobile/typotitle.png" width="97px" height="39px">

                        </div>
                    </div>
                    <div class="con04_3">
                        <div class="logos">
                            <img src="./images/portfolio_mobile/Logotype.png" height="39px">
                            <img src="./images/portfolio_mobile/logos.png" class="logo" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200"> 
                        </div>
                    </div>
                    <div class="con04_4">
                        <div class="title">
                            <img src="./images/portfolio_mobile/App.png">
                        </div>
                        <div class="appicon">
                            <img src="./images/portfolio_mobile/App01.png">
                            <img src="./images/portfolio_mobile/App02.png" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200">
                         </div>
                    </div>
                </section>
            
                <section class="con06">
                    <div class="con06title"></div>
                    <div class="con06_sub01">
                        <div class="point01">
                            <img src="./images/portfolio_mobile/point01_text.png">
                        </div>
                        <div class="point01_2">
                            <img src="./images/portfolio_mobile/icon01.png" class="icon01" data-aos="fade-left" data-aos-delay="700" data-aos-duration="1000">
                            <img src="./images/portfolio_mobile/icon02.png" class="icon01" data-aos="fade-left" data-aos-delay="700" data-aos-duration="800">
                            <img src="./images/portfolio_mobile/icon03.png" class="icon01" data-aos="fade-left" data-aos-delay="500" data-aos-duration="600">
                        </div>
                        <div class="point01_3">
                            <img src="./images/portfolio_mobile/mobile04.png" class="icon01_2" data-aos="fade-left" data-aos-offset="300"  data-aos-duration="500"
                            data-aos-easing="ease-in-sine">
                        </div>
                    </div>
                    <div class="con06_sub02">
                        <div class="point02">
                            <img src="./images/portfolio_mobile/mobile07.png" class="icon01_2" data-aos="fade-right" data-aos-offset="300" data-aos-duration="500"
                            data-aos-easing="ease-in-sine">
                        </div>
                        <div class="point02_2">
                            <img src="./images/portfolio_mobile/point02_img01.png" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="800" data-aos-delay="200">
                            <img src="./images/portfolio_mobile/point02_img02.png" class="icon02" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="800" data-aos-delay="200">
                        </div>
                        <div class="point02_3">
                            <img src="./images/portfolio_mobile/point02_text.png" class="icon02_2">
                        </div>
                    </div>
                    <div class="con06_sub03">
                        <div class="point03">
                            <img src="./images/portfolio_mobile/point03_text.png">
                        </div>
                        <div class="point03_2">
                            <img src="./images/portfolio_mobile/point03_img02.png" class="icon03_1" data-aos="fade-left" data-aos-delay="700" data-aos-duration="1000">
                            <img src="./images/portfolio_mobile/point03_img01.png" class="icon03" data-aos="fade-left" data-aos-delay="700" data-aos-duration="800">
                        </div>
                        <div class="point03_3">
                            <img src="./images/portfolio_mobile/mobile09.png" class="icon03_2" data-aos="fade-left" data-aos-offset="300" data-aos-duration="500"
                            data-aos-easing="ease-in-sine">
                        </div>
                    </div>
                    <div class="con07title"></div>
                </section>  

                <section class="con07">
                    <div class="con07_1">
                        <img src="./images/portfolio_mobile/mobile01.png">
                        <img src="./images/portfolio_mobile/mobile02.png">
                        <img src="./images/portfolio_mobile/mobile03.png">
                    </div>
                    <div class="con07_2">
                        <img src="./images/portfolio_mobile/mobile04.png">
                        <img src="./images/portfolio_mobile/mobile05.png">
                        <img src="./images/portfolio_mobile/mobile06.png">
                    </div>
                    <div class="con07_3">
                        <img src="./images/portfolio_mobile/mobile07.png">
                        <img src="./images/portfolio_mobile/mobile08.png">
                        <img src="./images/portfolio_mobile/mobile09.png">
                    </div>
                </section>

                <section class="con08">
                    <div class="con08_title">
                        <img src="./images/portfolio_mobile/con08_title.png" width="375px">
                        <img src="./images/portfolio_mobile/con08_img.png" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200">
                    </div>
                    <div class="con08_epil">
                        <div class="con08_epil01">
                            <img src="./images/portfolio_mobile/con08_text.png" data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000" data-aos-delay="200">
                        </div>
                    </div>
                </section>

            </div>

            <div class="topBtn"><span><img src="./images/portfolio_mobile/TOP.png"></span></div>


             <!--탑버튼 !-->
             <script>
                $(function() {
                  $(window).scroll(function() { 
                    if ($(this).scrollTop() > 200) { 
                      $('.topBtn').fadeIn(); } 
                    else { $('.topBtn').fadeOut(); }
                  }); 
                  $(".topBtn").click(function() { 
                     $('html, body').animate({ scrollTop : 0  }, 300); 
                    return false; });
                });
            </script>

            <!--스크롤애니메이션 !-->
            <script>
                $(window).scroll(function() {
                    $('.con01_right').each(function(){
                    var imagePos = $(this).offset().top;

                    var topOfWindow = $(window).scrollTop();
                        if (imagePos < topOfWindow+900) {
                            $(this).addClass("rolling01");
                        }else{
                            $(this).removeClass("rolling01");
                        }
                    });
                });
            </script>
        </div>
    </body>
</html>
