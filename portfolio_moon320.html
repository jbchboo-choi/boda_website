<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MOON320 — Boda</title>
    <link href="css/reset.css" rel="stylesheet" type="text/css">
    <link href="css/menu_popup.css?v=20261014-menu14" rel="stylesheet" type="text/css">
    <link href="css/portfolio_pickgo.css?v=20261016-rounded-shadow1" rel="stylesheet" type="text/css">
    <link href="css/portfolio_moon320.css?v=20261016-moon320-rounded-shadow1" rel="stylesheet" type="text/css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    </style>
</head>
<body>
    <div id="wrap">
        <div id="margin">
            <header class="main">
                <div class="main01">
                    <div class="mainplus">
                        <a class="work-back-button" href="./portfolio.html" aria-label="Work 목록으로 이동">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                        </a>
                    </div>
                    <div class="mainmenu"><div>Work / Branding</div></div>
                    <a href="./index.html" aria-label="Boda home"><div class="mainlogo"></div></a>
                </div>
            </header>

            <main class="pickgo-page moon320-page">
                <section class="pickgo-hero moon320-hero" aria-labelledby="moon320-title">
                    <div class="pickgo-hero-copy">
                        <p class="pickgo-type-label">Branding</p>
                        <h1 id="moon320-title">MOON320</h1>
                        <p class="pickgo-summary">전통주의 감성을 현대적으로 재해석한 패키지 디자인</p>
                        <div class="pickgo-rule"></div>
                        <dl class="pickgo-meta">
                            <div><dt>작업기간</dt><dd>2019</dd></div>
                            <div><dt>프로젝트 구분</dt><dd>실무 프로젝트</dd></div>
                            <div><dt>참여 형태</dt><dd>개인 주도 · 연구팀 협업</dd></div>
                            <div><dt>담당 범위</dt><dd class="pickgo-tags"><span>BI 디자인</span><span>라벨 디자인</span><span>패키지 디자인</span><span>리플렛 디자인</span></dd></div>
                            <div><dt>상태</dt><dd>실제 제작</dd></div>
                        </dl>
                        <div class="pickgo-actions">
                            <a class="pickgo-button pickgo-button-primary" href="#moon320-gallery">디자인 상세 보기 <span class="pickgo-external-arrow" aria-hidden="true"></span></a>
                        </div>
                    </div>
                    <div class="pickgo-hero-media">
                        <img src="images/portfolio/moon320/hero.jpg" alt="문삼이공 MOON320 패키지 대표 이미지">
                    </div>
                </section>

                <section class="moon320-gallery" id="moon320-gallery" aria-labelledby="moon320-gallery-title">
                    <div class="moon320-gallery-heading">
                        <div>
                            <p class="pickgo-eyebrow">DESIGN DETAILS</p>
                            <h2 id="moon320-gallery-title">문삼이공 패키지 디자인</h2>
                        </div>
                    </div>
                    <div class="moon320-gallery-grid">
                        <button class="moon320-gallery-item" type="button" aria-label="문삼이공 화이트 제품 이미지 크게 보기" data-image="images/portfolio/moon320/detail-white.jpg" data-alt="문삼이공 화이트 제품 이미지">
                            <img src="images/portfolio/moon320/detail-white.jpg" alt="문삼이공 화이트 제품 이미지" loading="lazy">
                        </button>
                        <button class="moon320-gallery-item" type="button" aria-label="문삼이공 블랙 제품 이미지 크게 보기" data-image="images/portfolio/moon320/detail-black.jpg" data-alt="문삼이공 블랙 제품 이미지">
                            <img src="images/portfolio/moon320/detail-black.jpg" alt="문삼이공 블랙 제품 이미지" loading="lazy">
                        </button>
                        <button class="moon320-gallery-item" type="button" aria-label="문삼이공 제품과 패키지 이미지 크게 보기" data-image="images/portfolio/moon320/detail-set.jpg" data-alt="문삼이공 제품과 패키지 이미지">
                            <img src="images/portfolio/moon320/detail-set.jpg" alt="문삼이공 제품과 패키지 이미지" loading="lazy">
                        </button>
                        <button class="moon320-gallery-item" type="button" aria-label="문삼이공 제품 두 병 이미지 크게 보기" data-image="images/portfolio/moon320/detail-bottles.jpg" data-alt="문삼이공 제품 두 병 이미지">
                            <img src="images/portfolio/moon320/detail-bottles.jpg" alt="문삼이공 제품 두 병 이미지" loading="lazy">
                        </button>
                    </div>
                </section>
            </main>

            <div class="moon320-lightbox" role="dialog" aria-modal="true" aria-label="이미지 확대 보기" aria-hidden="true">
                <button class="moon320-lightbox-close" type="button" aria-label="확대 이미지 닫기">×</button>
                <img src="" alt="">
            </div>
        </div>
    </div>

    <script>
        (() => {
            const lightbox = document.querySelector('.moon320-lightbox');
            const lightboxImage = lightbox.querySelector('img');
            const closeButton = lightbox.querySelector('.moon320-lightbox-close');
            const galleryItems = document.querySelectorAll('.moon320-gallery-item');
            let lastFocusedItem = null;

            const closeLightbox = () => {
                lightbox.classList.remove('is-open');
                lightbox.setAttribute('aria-hidden', 'true');
                lightboxImage.removeAttribute('src');
                document.body.style.overflow = '';
                lastFocusedItem?.focus();
            };

            galleryItems.forEach((item) => {
                item.addEventListener('click', () => {
                    lastFocusedItem = item;
                    lightboxImage.src = item.dataset.image;
                    lightboxImage.alt = item.dataset.alt;
                    lightbox.classList.add('is-open');
                    lightbox.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                    closeButton.focus();
                });
            });

            closeButton.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (event) => {
                if (event.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
            });
        })();
    </script>
</body>
</html>
