<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Disneyplus_process</title>
        <link href="css/reset.css" rel="stylesheet" type="text/css"/>
        <link href="css/style_disney_process.css" rel="stylesheet" type="text/css"/>
        <link href="js/top.js" rel="stylesheet" type="text/js"/>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap');
        </style>
    </head> 
    <body>
        <div id="wrap">        
            <div id="margin">      
                <section class="main">
                    <div class="main01"></div>
                    <div class="main02"></div>
                </section>

                <section class="con01">
                    <div class="overview">
                        <div class="overview01"></div>
                        <div class="overview02"></div>
                    </div>
                    <div class="concept">
                        <div class="concept01"></div>
                    </div>
                </section>

                <section class="con02">
                    <div class="text"></div>   
                    <div class="color">
                        <div class="color01"></div>  
                        <div class="color02"></div>  
                    </div>   
                </section>

                <section class="con03">
                    <div class="icon">
                        <div class="icon01"></div>
                        <div class="icon02"></div>
                    </div>   
                    <div class="typo">
                        <div class="typo01"></div>
                        <div class="typo02"></div>
                    </div>   
                </section>
 
                <section class="con04">
                    <div class="retouch">
                        <div class="retouch01"></div>
                        <div class="retouch02">
                            <div class="retouch03"></div>
                            <div class="retouch04"></div>
                        </div>
                    </div>      
                </section>

                <section class="con05">
                    <div class="pages">
                        <div class="mainpage">
                            <div class="mainpage_title"></div>
                            <div class="mainpage_cont">
                                <div class="mainpage_img"></div>
                                <div class="mainpage_text">
                                    <div class="mainpage_text01"></div>
                                    <div class="mainpage_text02"></div>
                                    <div class="mainpage_text03"></div>
                                    <div class="mainpage_text04"></div>
                                    <div class="mainpage_text05"></div>
                                    <div class="mainpage_text06"></div>
                                </div>
                            </div>
                        </div>
                        <div class="subpage">
                            <div class="subpage_title"></div>
                            <div class="subpage_cont">
                                <div class="subpage_img01">
                                    <div class="subpage01"></div>
                                    <div class="subpage02"></div>
                                    <div class="subpage03"></div>
                                </div>
                                <div class="subpage_img02">
                                    <div class="subpage04"></div>
                                    <div class="subpage05"></div>
                                    <div class="subpage06"></div>
                                </div>
                            </div>
                        </div>
                    </div>   
                </section>

                <section class="con06">
                    <div class="publish">
                        <div class="publish01"></div>
                        <div class="publish02"></div>
                        <div class="publish03"></div>
                    </div>
                    <div class="process"></div>
                </section>

                <section class="con07">
                    <div class="epilogue"></div>
                </section>
            </div>
            
            <div class="topBtn"><span><img src="./images/disney/topbutton.png"></span></div>



             <!--탑버튼 !-->
             <script>
                $(function() {
                  $(window).scroll(function() { 
                    if ($(this).scrollTop() > 200) { 
                      $('.topBtn').fadeIn(); } 
                    else { $('.topBtn').fadeOut(); }
                  }); 
                  $(".topBtn").click(function() { 
                     $('html, body').animate({ scrollTop : 0  }, 300); 
                    return false; });
                });
            </script>


        </div>
        
    </body>
 
</html>
